name: Check collector secret configuration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-collector-secrets.yml']
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check FRED API key presence without revealing its value
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import os
          present = bool(os.environ.get('FRED_API_KEY'))
          print('FRED_API_KEY configured:', present)
          if not present:
              raise SystemExit('Repository secret FRED_API_KEY is not available to this workflow')
          PY
