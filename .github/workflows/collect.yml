name: Collect public research
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-os-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check database configuration
        run: python -c "import os; assert os.environ.get('TURSO_DATABASE_URL') and os.environ.get('TURSO_AUTH_TOKEN'), 'Configure Turso secrets'"
      - run: python -m research_os.collector --mode all
